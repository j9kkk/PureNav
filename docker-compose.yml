services:
  purenav:
    image: ghcr.io/j9kkk/purenav:latest
    # For local builds, replace the line above with a build stanza:
    # build: .
    container_name: purenav
    restart: unless-stopped
    ports:
      # Host port is configurable because 8080 is commonly taken; container always listens on 8080.
      - '${PURENAV_PORT:-8090}:8080'
    environment:
      TZ: Asia/Shanghai
      # PURE_SESSION_TTL_DAYS: 7
      # PURE_TRUST_PROXY: '1'      # enable when behind a reverse proxy
      # PURE_SECURE_COOKIE: '1'    # require HTTPS for the session cookie
      # LOG_LEVEL: info
    volumes:
      - ./data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
