name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref cancels the older run; PRs are keyed by ref too.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build web
        run: npm run build -w @purenav/web

      - name: Build server
        run: npm run build -w @purenav/server

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Builds the real image on every PR so a broken Dockerfile fails here, not at release time.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: purenav:ci
          cache-from: type=gha,scope=purenav
          cache-to: type=gha,mode=max,scope=purenav
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Smoke test image
        run: |
          docker run -d --name purenav-ci -p 8080:8080 purenav:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then
              echo "health ok after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/api/v1/auth/state
          curl -fsS http://127.0.0.1:8080/ | grep -qi '<div id="root">'
          echo "--- container log ---"
          docker logs purenav-ci
          docker rm -f purenav-ci
